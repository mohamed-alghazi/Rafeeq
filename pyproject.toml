[project]
name = "rafeeq"
version = "0.1.0"
description = "Bilingual municipal assistant — Agentic AI capstone"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=1.70,<3", "mcp>=1.9,<2", "python-dotenv>=1,<2", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
